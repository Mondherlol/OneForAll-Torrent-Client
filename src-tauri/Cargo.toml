[package]
name = "oneforall"
version = "0.5.1"
description = "Une interface moderne pour qBittorrent"
edition = "2021"

[lib]
name = "oneforall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["sync", "time"] }
regex = "1"
sha1 = "0.11.0"
sha2 = "0.11.1"
walkdir = "2.5.0"
trash = "5.3.0"
sysinfo = { version = "0.40.1", default-features = false, features = ["disk"] }
tauri-plugin-dialog = "2"
winreg = "0.56.0"
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Shell"] }
tauri-winrt-notification = "0.8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
base64 = "0.23.1"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

# Binaire final : petit et rapide
[profile.release]
opt-level = 3
# Build parallèle : « lto = true » + « codegen-units = 1 » optimisaient tout sur UN cœur (~10 min par release)
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
